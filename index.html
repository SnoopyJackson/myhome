<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suivi maison</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #EEF1F0;
  --surface: #FFFFFF;
  --ink: #1B2830;
  --muted: #5D6C74;
  --line: #D5DCDA;
  --accent: #2F5D62;
  --accent-ink: #FFFFFF;
  --hi: #B23A24;
  --mid: #9A6F0E;
  --lo: #3E7A4E;
  --chip-s: 42%;
  --chip-l: 64%;
  --font-head: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12191C; --surface: #1A2428; --ink: #E6ECEA; --muted: #93A3A9; --line: #2A373C;
    --accent: #7FB8BC; --accent-ink: #0F1A1C; --hi: #F08A73; --mid: #E0B34F; --lo: #7CC28F;
    --chip-s: 34%; --chip-l: 42%;
  }
}
:root[data-theme="dark"] {
  --bg: #12191C; --surface: #1A2428; --ink: #E6ECEA; --muted: #93A3A9; --line: #2A373C;
  --accent: #7FB8BC; --accent-ink: #0F1A1C; --hi: #F08A73; --mid: #E0B34F; --lo: #7CC28F;
  --chip-s: 34%; --chip-l: 42%;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 1040px; margin: 0 auto; padding: 20px 16px 96px; }

/* Header */
.top h1 {
  font-family: var(--font-head); font-weight: 700; font-size: clamp(2rem, 6vw, 3rem);
  letter-spacing: -0.02em; line-height: 1.05; margin: 8px 0 14px;
}
.figures { display: flex; flex-wrap: wrap; gap: 8px 28px; margin: 0 0 20px; }
.fig { display: flex; flex-direction: column; }
.fig b { font-family: var(--font-head); font-size: 1.5rem; font-weight: 700; line-height: 1.1; }
.fig span { color: var(--muted); font-size: .875rem; }

/* Tabs */
.tabs { display: flex; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line);
  border-radius: 12px; width: 100%; margin-bottom: 12px; overflow-x: auto; }
.tab { flex: 1; border: 0; background: transparent; padding: 10px 8px; border-radius: 9px; font-weight: 600; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.tab { white-space: nowrap; }
.data-tools { display: flex; gap: 8px; margin-bottom: 22px; }

/* Room chips */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.chip {
  --h: 200;
  text-align: left; padding: 0; border: 1px solid var(--line); background: var(--surface);
  border-radius: 10px; overflow: hidden; display: flex; flex-direction: column;
}
.chip:hover { border-color: var(--accent); }
.swatch { height: 52px; background: hsl(var(--h) var(--chip-s) var(--chip-l)); }
.chip .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 2px; flex: 1; }
.chip h3 { margin: 0; font-family: var(--font-head); font-size: 1.05rem; font-weight: 700; line-height: 1.2; }
.chip .meta { color: var(--muted); font-size: .85rem; }
.bar { height: 4px; background: var(--line); border-radius: 2px; margin-top: 8px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--lo); }

/* Room view */
.back { border: 0; background: transparent; color: var(--muted); padding: 8px 0; font-weight: 600; margin-bottom: 4px; }
.room-head { --h: 200; display: flex; align-items: stretch; gap: 14px; margin-bottom: 20px; }
.room-head .swatch { width: 14px; height: auto; border-radius: 4px; flex: none; }
.room-head h2 { font-family: var(--font-head); font-size: clamp(1.8rem, 5vw, 2.4rem); margin: 0; line-height: 1.1; letter-spacing: -0.02em; }
.room-head p { margin: 2px 0 0; color: var(--muted); }
.cols { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 760px) { .cols { grid-template-columns: 1fr 1fr; align-items: start; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 14px 10px; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
.panel-head h3 { font-family: var(--font-head); font-size: 1.25rem; margin: 0; }
.panel-head small { color: var(--muted); }
.add { width: 100%; margin-top: 8px; padding: 11px; border: 1px dashed var(--line); background: transparent;
  border-radius: 8px; color: var(--accent); font-weight: 600; }
.add:hover { border-color: var(--accent); }
.empty { color: var(--muted); margin: 10px 0 4px; }

/* Items */
.list { list-style: none; margin: 0; padding: 0; }
.item { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.item input[type=checkbox] { width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--accent); flex: none; }
.item .txt { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 0; }
.item .t { display: block; font-weight: 500; overflow-wrap: anywhere; }
.item .m { display: flex; flex-wrap: wrap; gap: 2px 12px; color: var(--muted); font-size: .85rem; margin-top: 1px; }
.item.done .t { text-decoration: line-through; color: var(--muted); }
.item.done .m { opacity: .8; }
.prio::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; background: currentColor; }
.prio.haute { color: var(--hi); } .prio.moyenne { color: var(--mid); } .prio.basse { color: var(--lo); }
.price { font-variant-numeric: tabular-nums; }
.maintenance-list { display: grid; gap: 12px; }
.maintenance-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.maintenance-card h3 { font-family: var(--font-head); font-size: 1.15rem; margin: 0; }
.maintenance-card p { margin: 6px 0 0; }
.maintenance-meta { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--muted); font-size: .9rem; margin-top: 8px; }
.maintenance-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.maintenance-card.overdue { border-left: 4px solid var(--hi); }
.maintenance-card.soon { border-left: 4px solid var(--mid); }
.maintenance-card.upcoming { border-left: 4px solid var(--lo); }

/* Global views */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; margin-bottom: 14px; }
.toolbar label { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); }
.toolbar select { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
.group { margin-bottom: 14px; }
.group h3 { font-family: var(--font-head); font-size: 1.1rem; margin: 0 0 2px; display: flex; align-items: center; gap: 10px; }
.group h3 .dot { --h: 200; width: 12px; height: 12px; border-radius: 3px; background: hsl(var(--h) var(--chip-s) var(--chip-l)); }

/* Dialog */
dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink);
  padding: 0; width: min(480px, calc(100% - 24px)); max-height: calc(100% - 24px); }
dialog::backdrop { background: rgba(10, 18, 20, .55); }
.dlg { padding: 18px; display: grid; gap: 14px; }
.dlg h2 { font-family: var(--font-head); margin: 0; font-size: 1.4rem; }
.field { display: grid; gap: 4px; }
.field > span, .field legend { font-size: .875rem; color: var(--muted); font-weight: 500; padding: 0; }
.field input[type=text], .field input[type=number], .field select, .field textarea {
  width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg);
}
.field textarea { min-height: 72px; resize: vertical; }
fieldset.field { border: 0; margin: 0; padding: 0; }
.seg { display: flex; gap: 4px; padding: 3px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; }
.seg label { flex: 1; text-align: center; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg span { display: block; padding: 8px; border-radius: 7px; font-weight: 600; color: var(--muted); cursor: pointer; }
.seg input:checked + span { background: var(--accent); color: var(--accent-ink); }
.seg input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.btn { padding: 10px 16px; border-radius: 9px; border: 1px solid var(--line); background: transparent; font-weight: 600; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--hi); margin-right: auto; }

.foot { margin-top: 28px; color: var(--muted); font-size: .85rem; }
@media (prefers-reduced-motion: no-preference) { .bar i { transition: width .25s ease; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Suivi maison</h1>
    <div class="figures" id="figures"></div>
    <div class="tabs" role="tablist" aria-label="Vues">
      <button class="tab" role="tab" data-action="view" data-view="rooms">Pièces</button>
      <button class="tab" role="tab" data-action="view" data-view="buy">À acheter</button>
      <button class="tab" role="tab" data-action="view" data-view="todo">Améliorations</button>
      <button class="tab" role="tab" data-action="view" data-view="maintenance">Plan de maintenance</button>
    </div>
    <div class="data-tools" aria-label="Sauvegarde des données">
      <button class="btn" type="button" data-action="export">Exporter JSON</button>
      <button class="btn" type="button" data-action="import">Importer JSON</button>
      <input id="importFile" type="file" accept=".json,application/json" hidden>
    </div>
  </header>
  <main id="main"></main>
  <p class="foot" id="status"></p>
</div>

<dialog id="dlg" aria-labelledby="dlg-title">
  <form class="dlg" id="form">
    <h2 id="dlg-title">Ajouter</h2>
    <fieldset class="field">
      <legend>Type</legend>
      <div class="seg">
        <label><input type="radio" name="type" value="buy" checked><span>À acheter</span></label>
        <label><input type="radio" name="type" value="todo"><span>Amélioration</span></label>
      </div>
    </fieldset>
    <label class="field"><span>Titre</span><input type="text" name="title" required maxlength="140" autocomplete="off"></label>
    <div class="row2">
      <label class="field"><span>Pièce</span><select name="room"></select></label>
      <label class="field"><span>Priorité</span>
        <select name="prio"><option value="haute">Haute</option><option value="moyenne" selected>Moyenne</option><option value="basse">Basse</option></select>
      </label>
    </div>
    <label class="field" id="priceField"><span>Prix estimé (€)</span><input type="number" name="price" min="0" step="0.01" inputmode="decimal"></label>
    <label class="field"><span>Note (lien, dimensions, magasin…)</span><textarea name="note" maxlength="600"></textarea></label>
    <div class="actions">
      <button type="button" class="btn danger" id="delBtn">Supprimer</button>
      <button type="button" class="btn" id="cancelBtn">Annuler</button>
      <button type="submit" class="btn primary">Enregistrer</button>
    </div>
  </form>
</dialog>

<dialog id="maintenanceDlg" aria-labelledby="maintenance-title">
  <form class="dlg" id="maintenanceForm">
    <h2 id="maintenance-title">Ajouter une maintenance</h2>
    <label class="field"><span>Équipement</span><input type="text" name="equipment" required maxlength="100" placeholder="Pompe à chaleur"></label>
    <label class="field"><span>Action à faire / modification</span><input type="text" name="title" required maxlength="140" placeholder="Entretien annuel"></label>
    <div class="row2">
      <label class="field"><span>Dernière réalisation</span><input type="date" name="lastDate"></label>
      <label class="field"><span>Prochaine échéance</span><input type="date" name="nextDate"></label>
    </div>
    <div class="row2">
      <label class="field"><span>Répéter tous les</span><input type="number" name="interval" min="1" max="999" step="1" placeholder="12"></label>
      <label class="field"><span>Unité</span><select name="intervalUnit"><option value="months">Mois</option><option value="years">Ans</option><option value="days">Jours</option></select></label>
    </div>
    <label class="field"><span>Notes</span><textarea name="note" maxlength="600" placeholder="Prestataire, référence, détails…"></textarea></label>
    <div class="actions">
      <button type="button" class="btn danger" id="maintenanceDelete">Supprimer</button>
      <button type="button" class="btn" id="maintenanceCancel">Annuler</button>
      <button type="submit" class="btn primary">Enregistrer</button>
    </div>
  </form>
</dialog>

<script>
(function () {
  "use strict";
  var ROOMS = [
    { id: "garage", name: "Garage", h: 210 },
    { id: "terrasse1", name: "Terrasse 1", h: 150 },
    { id: "terrasse2", name: "Terrasse 2", h: 168 },
    { id: "jardin", name: "Jardin", h: 118 },
    { id: "parking", name: "Parking", h: 226 },
    { id: "salon", name: "Salon", h: 24 },
    { id: "cuisine", name: "Cuisine", h: 44 },
    { id: "buanderie", name: "Buanderie", h: 190 },
    { id: "toilet1", name: "Toilette 1", h: 262 },
    { id: "sdb1", name: "Salle de bains 1", h: 196 },
    { id: "couloir", name: "Couloir", h: 34 },
    { id: "bureau", name: "Bureau", h: 238 },
    { id: "chambre1", name: "Chambre 1", h: 338 },
    { id: "chambre2", name: "Chambre 2", h: 300 },
    { id: "parent", name: "Chambre parent", h: 354 },
    { id: "dressing", name: "Dressing", h: 280 },
    { id: "sdb2", name: "Salle de bains 2", h: 178 }
  ];
  var ROOM = {}; ROOMS.forEach(function (r) { ROOM[r.id] = r; });
  var PRIO = { haute: 0, moyenne: 1, basse: 2 };
  var LS_KEY = "suivi-maison-v1";
  var DOC = "tracker/main";

  var items = [];
  var maintenance = [];
  var ui = { view: "rooms", room: null, showDone: false, prio: "all" };
  var db = null, syncTimer = null, syncState = "local";

  var $main = document.getElementById("main");
  var $figs = document.getElementById("figures");
  var $status = document.getElementById("status");
  var $dlg = document.getElementById("dlg");
  var $form = document.getElementById("form");
  var $maintenanceDlg = document.getElementById("maintenanceDlg");
  var $maintenanceForm = document.getElementById("maintenanceForm");
  var eur = new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR", maximumFractionDigits: 0 });
  var eur2 = new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR" });
  function money(n) { return (n % 1 === 0 ? eur : eur2).format(n); }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function uid() { return "i" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function plural(n, one, many) { return n + " " + (n > 1 ? many : one); }

  /* ---------- Storage ---------- */
  function readLocal() {
    try {
      var v = JSON.parse(localStorage.getItem(LS_KEY) || "null");
      if (v && Array.isArray(v.items)) {
        maintenance = Array.isArray(v.maintenance) ? v.maintenance : [];
        return v.items;
      }
    } catch (e) {}
    maintenance = [];
    return [];
  }
  function writeLocal() {
    try { localStorage.setItem(LS_KEY, JSON.stringify({ items: items, maintenance: maintenance })); return true; } catch (e) { return false; }
  }
  function pushDb() {
    if (!db) return;
    clearTimeout(syncTimer);
    syncTimer = setTimeout(function () {
      db.doc(DOC).set({ items: items, maintenance: maintenance, updated: Date.now() }).then(function () {
        syncState = "sync"; renderStatus();
      }).catch(function () { syncState = "local"; renderStatus(); });
    }, 400);
  }
  function save() { writeLocal(); pushDb(); renderStatus(); }
  function renderStatus() {
    $status.textContent = syncState === "sync"
      ? "Enregistré automatiquement et synchronisé entre vos appareils."
      : "Enregistré automatiquement sur cet appareil.";
  }
  async function initDb() {
    try {
      if (!window.claude || !window.claude.use) return;
      db = await window.claude.use("db");
      if (!db) return;
      var snap = await db.doc(DOC).get();
      if (snap.exists && snap.data() && Array.isArray(snap.data().items)) {
        var remote = snap.data();
        items = remote.items;
        if (Array.isArray(remote.maintenance)) maintenance = remote.maintenance;
        else if (maintenance.length) pushDb();
        writeLocal(); render();
      } else if (items.length || maintenance.length) { pushDb(); }
      syncState = "sync"; renderStatus();
    } catch (e) { db = null; }
  }

  /* ---------- Derived data ---------- */
  function sortItems(a, b) {
    if (a.done !== b.done) return a.done ? 1 : -1;
    if (PRIO[a.prio] !== PRIO[b.prio]) return PRIO[a.prio] - PRIO[b.prio];
    return (a.created || 0) - (b.created || 0);
  }
  function forRoom(id, type) { return items.filter(function (i) { return i.room === id && (!type || i.type === type); }).sort(sortItems); }
  function remainingBudget(list) { return list.reduce(function (s, i) { return s + (!i.done && i.type === "buy" ? (+i.price || 0) : 0); }, 0); }
  function localDateString(date) {
    var y = date.getFullYear(), m = String(date.getMonth() + 1).padStart(2, "0"), d = String(date.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + d;
  }
  function nextMaintenanceDate(entry, fromDate) {
    var date = new Date(fromDate + "T12:00:00");
    var interval = parseInt(entry.interval, 10);
    if (!entry.interval || !interval || isNaN(date.getTime())) return "";
    if (entry.intervalUnit === "years") date.setFullYear(date.getFullYear() + interval);
    else if (entry.intervalUnit === "days") date.setDate(date.getDate() + interval);
    else date.setMonth(date.getMonth() + interval);
    return localDateString(date);
  }

  /* ---------- Rendering ---------- */
  function renderFigures() {
    var buy = items.filter(function (i) { return i.type === "buy" && !i.done; });
    var todo = items.filter(function (i) { return i.type === "todo" && !i.done; });
    $figs.innerHTML =
      '<div class="fig"><b>' + buy.length + '</b><span>à acheter</span></div>' +
      '<div class="fig"><b>' + todo.length + '</b><span>améliorations à faire</span></div>' +
      '<div class="fig"><b>' + maintenance.length + '</b><span>maintenances planifiées</span></div>' +
      '<div class="fig"><b>' + money(remainingBudget(items)) + '</b><span>budget restant estimé</span></div>';
  }
  function renderTabs() {
    document.querySelectorAll(".tab").forEach(function (t) {
      t.setAttribute("aria-selected", String(t.dataset.view === ui.view));
    });
  }
  function itemRow(it, showRoom) {
    var meta = '<span class="prio ' + it.prio + '">' + it.prio + '</span>';
    if (it.type === "buy" && it.price) meta += '<span class="price">' + money(+it.price) + '</span>';
    if (showRoom) meta += '<span>' + esc(ROOM[it.room] ? ROOM[it.room].name : "") + '</span>';
    if (it.note) meta += '<span>' + esc(it.note.length > 60 ? it.note.slice(0, 60) + "…" : it.note) + '</span>';
    return '<li class="item' + (it.done ? " done" : "") + '">' +
      '<input type="checkbox" data-action="toggle" data-id="' + it.id + '"' + (it.done ? " checked" : "") +
      ' aria-label="Marquer « ' + esc(it.title) + ' » comme ' + (it.done ? "à faire" : "fait") + '">' +
      '<button class="txt" data-action="edit" data-id="' + it.id + '"><span class="t">' + esc(it.title) + '</span>' +
      '<span class="m">' + meta + '</span></button></li>';
  }
  function panel(roomId, type) {
    var list = forRoom(roomId, type);
    var isBuy = type === "buy";
    var open = list.filter(function (i) { return !i.done; }).length;
    var sub = isBuy && remainingBudget(list) ? money(remainingBudget(list)) : plural(open, "restant", "restants");
    return '<section class="panel"><div class="panel-head"><h3>' + (isBuy ? "À acheter" : "Améliorations") +
      '</h3><small>' + sub + '</small></div>' +
      (list.length ? '<ul class="list">' + list.map(function (i) { return itemRow(i, false); }).join("") + '</ul>'
        : '<p class="empty">' + (isBuy ? "Rien à acheter pour cette pièce." : "Aucune amélioration prévue.") + '</p>') +
      '<button class="add" data-action="add" data-room="' + roomId + '" data-type="' + type + '">' +
      (isBuy ? "Ajouter un achat" : "Ajouter une amélioration") + '</button></section>';
  }
  function renderRooms() {
    $main.innerHTML = '<div class="grid">' + ROOMS.map(function (r) {
      var all = forRoom(r.id), open = all.filter(function (i) { return !i.done; });
      var buys = open.filter(function (i) { return i.type === "buy"; }).length;
      var todos = open.length - buys;
      var pct = all.length ? Math.round(100 * (all.length - open.length) / all.length) : 0;
      var meta = all.length ? (open.length ? buys + " à acheter, " + todos + " à améliorer" : "Tout est fait") : "Rien de prévu";
      return '<button class="chip" style="--h:' + r.h + '" data-action="room" data-room="' + r.id + '">' +
        '<div class="swatch"></div><div class="body"><h3>' + esc(r.name) + '</h3><span class="meta">' + meta + '</span>' +
        (all.length ? '<div class="bar" aria-hidden="true"><i style="width:' + pct + '%"></i></div>' : "") +
        '</div></button>';
    }).join("") + '</div>';
  }
  function renderRoom() {
    var r = ROOM[ui.room];
    var all = forRoom(r.id), open = all.filter(function (i) { return !i.done; }).length;
    $main.innerHTML =
      '<button class="back" data-action="home">← Toutes les pièces</button>' +
      '<div class="room-head" style="--h:' + r.h + '"><div class="swatch"></div><div><h2>' + esc(r.name) + '</h2>' +
      '<p>' + (all.length ? plural(open, "élément restant", "éléments restants") + " sur " + all.length : "Aucun élément pour l’instant") + '</p></div></div>' +
      '<div class="cols">' + panel(r.id, "buy") + panel(r.id, "todo") + '</div>';
  }
  function renderGlobal() {
    var type = ui.view;
    var list = items.filter(function (i) {
      return i.type === type && (ui.showDone || !i.done) && (ui.prio === "all" || i.prio === ui.prio);
    });
    var html = '<div class="toolbar"><label>Priorité <select data-action="prio">' +
      [["all", "Toutes"], ["haute", "Haute"], ["moyenne", "Moyenne"], ["basse", "Basse"]].map(function (o) {
        return '<option value="' + o[0] + '"' + (ui.prio === o[0] ? " selected" : "") + '>' + o[1] + '</option>';
      }).join("") + '</select></label>' +
      '<label><input type="checkbox" data-action="showdone"' + (ui.showDone ? " checked" : "") + '> Afficher les terminés</label>' +
      (type === "buy" ? '<strong>' + money(remainingBudget(list)) + ' à prévoir</strong>' : "") + '</div>';
    var any = false;
    ROOMS.forEach(function (r) {
      var g = list.filter(function (i) { return i.room === r.id; }).sort(sortItems);
      if (!g.length) return;
      any = true;
      html += '<section class="group panel" style="margin-bottom:12px"><h3><span class="dot" style="--h:' + r.h + '"></span>' + esc(r.name) +
        '</h3><ul class="list">' + g.map(function (i) { return itemRow(i, false); }).join("") + '</ul></section>';
    });
    if (!any) {
      html += '<p class="empty">' + (type === "buy" ? "Aucun achat à afficher." : "Aucune amélioration à afficher.") +
        ' Ouvrez une pièce pour en ajouter.</p>';
    }
    $main.innerHTML = html;
  }
  function formatDate(value) {
    if (!value) return "Non renseignée";
    var date = new Date(value + "T12:00:00");
    return isNaN(date.getTime()) ? "Non renseignée" : new Intl.DateTimeFormat("fr-FR").format(date);
  }
  function renderMaintenance() {
    var today = localDateString(new Date());
    var sorted = maintenance.slice().sort(function (a, b) {
      return (a.nextDate || "9999-12-31").localeCompare(b.nextDate || "9999-12-31");
    });
    var cards = sorted.map(function (entry) {
      var state = entry.nextDate && entry.nextDate < today ? "overdue" : (entry.nextDate && entry.nextDate <= localDateString(new Date(Date.now() + 30 * 86400000)) ? "soon" : "upcoming");
      var intervalLabel = entry.interval ? "Tous les " + entry.interval + " " + ({ days: "jour(s)", months: "mois", years: "an(s)" }[entry.intervalUnit] || "mois") : "Sans répétition définie";
      return '<article class="maintenance-card ' + state + '"><h3>' + esc(entry.equipment) + ' — ' + esc(entry.title) + '</h3>' +
        (entry.note ? '<p>' + esc(entry.note) + '</p>' : '') +
        '<div class="maintenance-meta"><span>Dernière fois : ' + formatDate(entry.lastDate) + '</span><span>Prochaine : ' + formatDate(entry.nextDate) + '</span><span>' + esc(intervalLabel) + '</span></div>' +
        '<div class="maintenance-actions"><button class="btn primary" data-action="maintenance-done" data-id="' + esc(entry.id) + '">Marquer comme effectué</button>' +
        '<button class="btn" data-action="maintenance-edit" data-id="' + esc(entry.id) + '">Modifier</button></div></article>';
    }).join("");
    $main.innerHTML = '<div class="toolbar"><strong>Entretiens, contrôles et modifications à planifier</strong><button class="btn primary" data-action="maintenance-add">Ajouter une tâche</button></div>' +
      (cards ? '<div class="maintenance-list">' + cards + '</div>' : '<p class="empty">Aucune maintenance planifiée. Ajoutez par exemple l’entretien annuel de la pompe à chaleur.</p>');
  }
  function render() {
    renderFigures(); renderTabs();
    if (ui.view === "rooms") { ui.room ? renderRoom() : renderRooms(); }
    else if (ui.view === "maintenance") renderMaintenance();
    else renderGlobal();
  }

  /* ---------- Maintenance planner ---------- */
  var editingMaintenanceId = null;
  function openMaintenanceDialog(id) {
    var entry = id ? maintenance.filter(function (m) { return m.id === id; })[0] : null;
    editingMaintenanceId = entry ? entry.id : null;
    document.getElementById("maintenance-title").textContent = entry ? "Modifier la maintenance" : "Ajouter une maintenance";
    document.getElementById("maintenanceDelete").hidden = !entry;
    $maintenanceForm.reset();
    $maintenanceForm.equipment.value = entry ? entry.equipment : "";
    $maintenanceForm.title.value = entry ? entry.title : "";
    $maintenanceForm.lastDate.value = entry ? (entry.lastDate || "") : "";
    $maintenanceForm.nextDate.value = entry ? (entry.nextDate || "") : "";
    $maintenanceForm.interval.value = entry ? (entry.interval || "") : "";
    $maintenanceForm.intervalUnit.value = entry ? (entry.intervalUnit || "months") : "months";
    $maintenanceForm.note.value = entry ? (entry.note || "") : "";
    $maintenanceDlg.showModal();
    setTimeout(function () { $maintenanceForm.equipment.focus(); }, 0);
  }
  document.getElementById("maintenanceCancel").addEventListener("click", function () { $maintenanceDlg.close(); });
  document.getElementById("maintenanceDelete").addEventListener("click", function () {
    if (!editingMaintenanceId || !window.confirm("Supprimer cette tâche de maintenance ?")) return;
    maintenance = maintenance.filter(function (m) { return m.id !== editingMaintenanceId; });
    save(); $maintenanceDlg.close(); render();
  });
  $maintenanceDlg.addEventListener("click", function (e) { if (e.target === $maintenanceDlg) $maintenanceDlg.close(); });
  $maintenanceForm.addEventListener("submit", function (e) {
    e.preventDefault();
    var data = {
      equipment: $maintenanceForm.equipment.value.trim(), title: $maintenanceForm.title.value.trim(),
      lastDate: $maintenanceForm.lastDate.value, nextDate: $maintenanceForm.nextDate.value,
      interval: $maintenanceForm.interval.value ? parseInt($maintenanceForm.interval.value, 10) : 0,
      intervalUnit: $maintenanceForm.intervalUnit.value, note: $maintenanceForm.note.value.trim()
    };
    if (editingMaintenanceId) maintenance.forEach(function (m) { if (m.id === editingMaintenanceId) Object.assign(m, data); });
    else maintenance.push(Object.assign({ id: uid(), created: Date.now() }, data));
    save(); $maintenanceDlg.close(); render();
  });

  /* ---------- JSON backup and restore ---------- */
  function exportJson() {
    var data = { format: "suivi-maison", version: 2, exportedAt: new Date().toISOString(), items: items, maintenance: maintenance };
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob), link = document.createElement("a");
    link.href = url; link.download = "suivi-maison-backup-" + localDateString(new Date()) + ".json";
    document.body.appendChild(link); link.click(); link.remove(); URL.revokeObjectURL(url);
    $status.textContent = "Sauvegarde JSON téléchargée.";
  }
  function importJson(file) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var data = JSON.parse(reader.result);
        if (!data || !Array.isArray(data.items) || (data.maintenance !== undefined && !Array.isArray(data.maintenance))) throw new Error("Format invalide");
        if (!window.confirm("Importer cette sauvegarde remplacera les données actuelles de l’application. Continuer ?")) return;
        items = data.items;
        maintenance = Array.isArray(data.maintenance) ? data.maintenance : [];
        save(); render();
        window.alert("Import terminé. Les données importées sont enregistrées sur cet appareil.");
      } catch (e) { window.alert("Impossible d’importer ce fichier. Choisissez un fichier JSON exporté depuis Suivi maison."); }
    };
    reader.onerror = function () { window.alert("Le fichier n’a pas pu être lu."); };
    reader.readAsText(file);
  }

  /* ---------- Dialog ---------- */
  var editingId = null;
  function fillRoomSelect() {
    $form.room.innerHTML = ROOMS.map(function (r) { return '<option value="' + r.id + '">' + esc(r.name) + '</option>'; }).join("");
  }
  function syncPriceField() {
    document.getElementById("priceField").hidden = $form.type.value !== "buy";
  }
  function openDialog(opts) {
    var it = opts.id ? items.filter(function (i) { return i.id === opts.id; })[0] : null;
    editingId = it ? it.id : null;
    document.getElementById("dlg-title").textContent = it ? "Modifier" : "Ajouter";
    document.getElementById("delBtn").hidden = !it;
    $form.reset();
    var type = it ? it.type : (opts.type || "buy");
    $form.querySelectorAll('input[name="type"]').forEach(function (r) { r.checked = r.value === type; });
    $form.title.value = it ? it.title : "";
    $form.room.value = it ? it.room : (opts.room || ROOMS[0].id);
    $form.prio.value = it ? it.prio : "moyenne";
    $form.price.value = it && it.price ? it.price : "";
    $form.note.value = it ? (it.note || "") : "";
    syncPriceField();
    $dlg.showModal();
    setTimeout(function () { $form.title.focus(); }, 0);
  }
  $form.addEventListener("change", function (e) { if (e.target.name === "type") syncPriceField(); });
  document.getElementById("cancelBtn").addEventListener("click", function () { $dlg.close(); });
  document.getElementById("delBtn").addEventListener("click", function () {
    if (!editingId) return;
    items = items.filter(function (i) { return i.id !== editingId; });
    save(); $dlg.close(); render();
  });
  $dlg.addEventListener("click", function (e) { if (e.target === $dlg) $dlg.close(); });
  $form.addEventListener("submit", function (e) {
    e.preventDefault();
    var title = $form.title.value.trim();
    if (!title) return;
    var type = $form.type.value;
    var data = {
      title: title, type: type, room: $form.room.value, prio: $form.prio.value,
      price: type === "buy" ? (parseFloat($form.price.value) || 0) : 0,
      note: $form.note.value.trim()
    };
    if (editingId) {
      items.forEach(function (i) { if (i.id === editingId) Object.assign(i, data); });
    } else {
      items.push(Object.assign({ id: uid(), done: false, created: Date.now() }, data));
    }
    save(); $dlg.close(); render();
  });

  /* ---------- Events ---------- */
  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-action]");
    if (!el) return;
    var a = el.dataset.action;
    if (a === "view") { ui.view = el.dataset.view; ui.room = null; render(); }
    else if (a === "room") { ui.room = el.dataset.room; render(); window.scrollTo(0, 0); }
    else if (a === "home") { ui.room = null; render(); }
    else if (a === "add") { openDialog({ room: el.dataset.room, type: el.dataset.type }); }
    else if (a === "edit") { openDialog({ id: el.dataset.id }); }
    else if (a === "maintenance-add") openMaintenanceDialog();
    else if (a === "maintenance-edit") openMaintenanceDialog(el.dataset.id);
    else if (a === "maintenance-done") {
      var entry = maintenance.filter(function (m) { return m.id === el.dataset.id; })[0];
      if (entry) {
        entry.lastDate = localDateString(new Date());
        entry.nextDate = nextMaintenanceDate(entry, entry.lastDate) || entry.nextDate;
        save(); render();
      }
    }
    else if (a === "export") exportJson();
    else if (a === "import") document.getElementById("importFile").click();
  });
  document.addEventListener("change", function (e) {
    if (e.target.id === "importFile") {
      if (e.target.files && e.target.files[0]) importJson(e.target.files[0]);
      e.target.value = "";
      return;
    }
    var el = e.target.closest("[data-action]");
    if (!el) return;
    var a = el.dataset.action;
    if (a === "toggle") {
      items.forEach(function (i) { if (i.id === el.dataset.id) i.done = el.checked; });
      save(); render();
    } else if (a === "showdone") { ui.showDone = el.checked; render(); }
    else if (a === "prio") { ui.prio = el.value; render(); }
  });

  /* ---------- Init ---------- */
  fillRoomSelect();
  items = readLocal();
  render(); renderStatus();
  initDb();
})();
</script>
</body>
</html>
